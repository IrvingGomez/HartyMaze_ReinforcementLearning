          { transform: `translate(${between(-16, 16)}px, ${between(34, 52)}px) rotate(${between(-180, 180)}deg)`, opacity: 0 }
        ], { duration: 560, delay, easing: "cubic-bezier(0.5, 0, 0.9, 0.6)" });
      }
    }

    // A dragged piece that couldn't be placed glides back to where it came from.
    function flyBack(ghost, home) {
      if (calmMotion) {
        ghost.remove();
        return;
      }
      ghost.animate([
        { left: ghost.style.left, top: ghost.style.top, opacity: 1 },
        { left: `${home.x}px`, top: `${home.y}px`, opacity: 0.2 }
      ], { duration: 300, easing: "cubic-bezier(0.3, 0.7, 0.4, 1)" }).onfinish = () => ghost.remove();
    }

    // =====================================================================
    // THE SHELF AND HEARTY'S SPEECH BUBBLE
    // =====================================================================

    function updateShelf() {
      for (const token of tokens) {
        const type = token.dataset.type;
        const info = token.querySelector(".token-info");
        const badge = token.querySelector(".token-badge");
        let infoText = { hearty: "Starts here", treasure: "The goal", hole: "Ends the attempt", portal: "Comes in pairs" }[type];
        let urgent = false;
        let badgeText = "";
        let badgeDone = false;
        let unavailable = false;
        let isOut = false;

        if (type === "hearty" || type === "treasure") {
          if (findCell(type) !== null) {
            infoText = "In the maze";
            badgeText = "✓";
            badgeDone = true;
            isOut = true;
          }
        } else if (type === "hole") {
          const holes = countOf("hole");
          if (holes > 0) badgeText = String(holes);
        } else if (type === "portal") {
          const pairsUsed = new Set([...pieces.values()].filter((p) => p.type === "portal").map((p) => p.pair)).size;
          if (pairsUsed > 0) badgeText = `${pairsUsed}/${MAX_PORTAL_PAIRS}`;
          const spot = nextPortalSpot();
          if (waitingPortalPair() !== -1) {
            infoText = "Needs a partner";
            urgent = true;
          } else if (spot === null) {
            infoText = "All pairs used";
            unavailable = true;
          }
          // The shelf shows the color of the next portal you would place.
          token.querySelector(".token-art svg").style.color = portalColor(spot === null ? 0 : spot.pair);
        }

        info.textContent = infoText;
        info.classList.toggle("is-urgent", urgent);
        // The badge gives a little hop whenever its number changes.
        if (badgeText !== "" && badgeText !== badge.textContent) {
          playOn(badge, [{ transform: "rotate(8deg) scale(0.4)" }, { transform: "rotate(-6deg) scale(1.25)" }, { transform: "rotate(8deg) scale(1)" }], { duration: 380, easing: "ease-out" });
        }
        badge.hidden = badgeText === "";
        badge.textContent = badgeText;
        badge.classList.toggle("is-done", badgeDone);
        token.classList.toggle("is-out", isOut);
        token.classList.toggle("is-held", holding !== null && holding.type === type && holding.from === null);
        // aria-disabled (not "disabled") so a tap can still explain why it is unavailable.
        token.setAttribute("aria-disabled", String(unavailable));
        token.setAttribute("aria-label", `${titleOf(type)}: ${infoText}. Drag onto a square, or press Enter and choose a square.`);
      }

      // The chalk arrow from Hearty to the maze shows only until Hearty has been placed.
      document.body.classList.toggle("show-start-arrow", findCell("hearty") === null && holding === null);

      wallCount.textContent = walls.size === 0 ? "None yet" : walls.size === 1 ? "1 built" : `${walls.size} built`;
      undoButton.disabled = history.length === 0;
      clearWallsButton.disabled = walls.size === 0;
      clearPiecesButton.disabled = pieces.size === 0;
    }

    // The big line in the bubble: what to do next.
    function nextStep() {
      if (holding !== null) {
        const { type, from } = holding;
        if (from !== null) return type === "hearty" ? "Tap a square to move me there." : `Tap a square to move ${describe(pieces.get(from))}.`;
        if (type === "portal") {
          const waiting = waitingPortalPair();
          return waiting === -1 ? "Tap a square for the portal." : `Now tap the square portal ${waiting + 1} takes me to.`;
        }
        return {
          hearty: "Tap a square to put me there.",
          treasure: "Tap a square to hide the treasure.",
          hole: "Tap a square to dig a hole."
        }[type];
      }
      if (selectedDot !== null) return "Now tap a glowing dot beside it to build a wall.";
      if (findCell("hearty") === null) return "Drag me onto any square to start.";
      if (findCell("treasure") === null) return "Now hide the treasure somewhere for me to find.";
      const waiting = waitingPortalPair();
      if (waiting !== -1) return `Portal ${waiting + 1} needs a partner. Drag in another portal.`;
      if (walls.size === 0) return "Make it tricky: tap two dots side by side to build a wall.";
      return "Looking good! Add holes or portals, or move things around.";
    }

    // The small line in the bubble: what just happened. It fades after a few seconds.
    function note(text, isWarning = false) {
      noteText = text;
      noteIsWarning = isWarning;
      clearTimeout(noteTimer);
      if (text !== "") {
        noteTimer = setTimeout(() => note(""), isWarning ? 6000 : 4000);
      }
      if (isWarning) {
        // Hearty shakes the bubble so the warning gets noticed.
        playOn(coachBubble, [{ transform: "translateX(0)" }, { transform: "translateX(-7px) rotate(-1deg)" }, { transform: "translateX(7px) rotate(1deg)" }, { transform: "translateX(0)" }], { duration: 280 });
      }
      updateCoach();
    }

    function updateCoach() {
      const say = nextStep();
      if (say !== lastSay && lastSay !== "") {
        // Hearty bobs as if talking, and the bubble pops, whenever there is something new to say.
        playOn(coachFace, [{ transform: "none" }, { transform: "translateY(-6px) rotate(-8deg)" }, { transform: "translateY(0) rotate(5deg)" }, { transform: "none" }], { duration: 460, easing: "ease-out" });
        playOn(coachBubble, [{ transform: "scale(0.97)" }, { transform: "scale(1.015)" }, { transform: "scale(1)" }], { duration: 260, easing: "ease-out" });
      }
      lastSay = say;
      coachSay.textContent = say;
      coachNote.textContent = noteText;
      coachNote.classList.toggle("is-warning", noteIsWarning);
      coachRemove.hidden = holding === null || holding.from === null;
      coachCancel.hidden = holding === null && selectedDot === null;
      coachCancel.textContent = holding !== null && holding.type === "hole" && holding.from === null ? "Done" : "Cancel";
    }

    function refresh() {
      drawBoard();
      updateShelf();
      updateCoach();
    }

    // =====================================================================
    // LISTENING TO FINGERS, MICE AND KEYBOARDS
    // A press starts when a finger touches down. If it moves a few pixels, it becomes a drag.
    // If it lifts without moving, it is a tap.
    // =====================================================================

    function startPress(event, what) {
      if (event.button !== 0) return;     // ignore right clicks
      event.preventDefault();             // stop the browser selecting text or dragging images
      if (press !== null && press.id === event.pointerId) {
        // The same mouse pressed again without us hearing it let go: drop the old press.
        if (press.drag) cancelDrag(press.drag);
        press = null;
      }
      if (press !== null) return;         // ignore a second finger
      press = { id: event.pointerId, startX: event.clientX, startY: event.clientY, what, drag: null, moved: false };
      // Keep getting this finger's moves even when it slides off the element it started on.
      event.currentTarget.setPointerCapture(event.pointerId);
    }

    board.addEventListener("pointerdown", (event) => {
      const thing = event.target.closest("[data-kind]");
      startPress(event, thing === null ? { kind: "board" } : { ...thing.dataset });
    });

    for (const token of tokens) {
      token.addEventListener("pointerdown", (event) => startPress(event, { kind: "token", type: token.dataset.type }));
      // Keyboard Enter or Space on a piece picks it up. (Mouse and finger taps are handled above.)
      token.addEventListener("click", (event) => {
        if (event.detail !== 0) return;
        tapToken(token.dataset.type);
        if (holding !== null) board.querySelector(".cell.is-open")?.focus();
      });
    }

    window.addEventListener("pointermove", (event) => {
      if (press === null || event.pointerId !== press.id) return;
      if (!press.moved) {
        if (Math.hypot(event.clientX - press.startX, event.clientY - press.startY) < DRAG_START_DISTANCE) return;
        press.moved = true;
        press.drag = startDrag(press.what, event);
      }
      if (press.drag) moveDrag(press.drag, event);
    });

    window.addEventListener("pointerup", (event) => {
      if (press === null || event.pointerId !== press.id) return;
      const finished = press;
      press = null;
      const cell = cellAt(event.clientX, event.clientY);
      const travel = Math.hypot(event.clientX - finished.startX, event.clientY - finished.startY);

      // Fingers wobble. A drag that ends almost where it started (and built no walls) was meant as a tap.
      if (finished.drag && travel < TAP_WOBBLE && !(finished.drag.kind === "wall" && finished.drag.built > 0)) {
        cancelDrag(finished.drag);
        handleTap(finished.what, cell);
      } else if (finished.drag) {
        finishDrag(finished.drag, event);
      } else if (!finished.moved || travel < TAP_WOBBLE) {
        handleTap(finished.what, cell);
      }
      // Anything else (a long slide that started on a wall, say) does nothing.
    });

    window.addEventListener("pointercancel", (event) => {
      if (press === null || event.pointerId !== press.id) return;
      if (press.drag) cancelDrag(press.drag);
      press = null;
    });

    board.addEventListener("keydown", (event) => {
      const thing = event.target.closest("[data-kind]");
      if (thing === null) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        handleTap({ ...thing.dataset }, thing.dataset.cell ?? null);
        if (holding !== null) board.querySelector(".cell.is-open")?.focus();
      } else if ((event.key === "Delete" || event.key === "Backspace") && thing.dataset.kind === "piece") {
        event.preventDefault();
        removePiece(thing.dataset.cell);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        stopEverything();
        note("");
        refresh();
      } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
        event.preventDefault();
        undo();
      }
    });

    coachCancel.addEventListener("click", () => {
      stopEverything();
      note("");
      refresh();
    });

    coachRemove.addEventListener("click", () => {
      if (holding !== null && holding.from !== null) removePiece(holding.from);
    });

    undoButton.addEventListener("click", undo);

    clearWallsButton.addEventListener("click", () => {
      saveForUndo();
      [...walls].forEach((key, index) => crumble(key, index * 35));
      walls.clear();
      stopEverything();
      note("Walls cleared. Undo brings them back.");
      refresh();
    });

    clearPiecesButton.addEventListener("click", () => {
      saveForUndo();
      [...pieces].forEach(([key, piece], index) => poof(cellCenter(key), piece, index * 60));
      pieces.clear();
      stopEverything();
      note("Pieces cleared. Undo brings them back.");
      refresh();
    });

    // =====================================================================
    // START
    // =====================================================================

    // Line the speech bubble up with the edge of the maze floor.
    document.documentElement.style.setProperty("--board-inset", `${MARGIN / BOARD_SIZE * 100}%`);
    document.body.classList.toggle("no-idle", !IDLE_ANIMATIONS);
    effects.setAttribute("viewBox", `0 0 ${BOARD_SIZE} ${BOARD_SIZE}`);
    refresh();
  </script>
